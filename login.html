<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  
  <link href="../dist/output.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

</head>

<body class="min-h-screen bg-[#A7D1E0] flex items-center justify-center">

  <form id="loginForm" class="bg-[#FFFFFF] p-10 rounded-2xl shadow-xl w-full max-w-md">
    <h1 class="font-title text-4xl mb-6 text-center">Login</h1>

    <input id="email" type="email" placeholder="Email"
      class="w-full border rounded-lg p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-black">

    <input id="password" type="password" placeholder="Password"
      class="w-full border rounded-lg p-3 mb-6 focus:outline-none focus:ring-2 focus:ring-black">

    <button
      class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800 transition">
      Login
    </button>

    <p class="text-sm text-center mt-6">
      Nog geen account?
      <a href="signup.html" class="underline">Sign up</a>
    </p>
  </form>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault()

      const email = document.getElementById('email').value
      const password = document.getElementById('password').value

      if (!email || !password) {
        alert('Vul alle velden in')
        return
      }

      localStorage.setItem('fakeUser', email)
      window.location.href = 'dashboard.html'
    })
  </script>

</body>
</html>
