<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welkom</title>

  <link href="../dist/output.css" rel="stylesheet">


  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

</head>

<body class="min-h-screen bg-[#DDE6ED] flex items-center justify-center px-4">

  <div class="bg-white w-full max-w-md p-10 rounded-2xl shadow-2xl text-center">

    <h1 class="font-title text-4xl mb-4">
      Welkom 👋 
    </h1>

    <p class="text-gray-600 mb-8">
      Geweldig dat je deze login-button even test! <br> <br> 
      Je bent ingelogd als<br>
      <strong id="user"></strong>
    </p>

    <div class="flex flex-col gap-4">
      <!-- Home button -->
      <a href="index.html"
         class="px-6 py-3 rounded-full bg-black text-white hover:bg-gray-800 transition">
        Bezoek website
      </a>

      <!-- Logout button -->
      <button onclick="logout()"
        class="px-6 py-3 rounded-full border border-gray-300 hover:border-black transition">
        Logout
      </button>
    </div>

  </div>

  <script>
    const user = localStorage.getItem('fakeUser')

    if (!user) {
      window.location.href = 'login.html'
    }

    document.getElementById('user').textContent = user

    function logout() {
      localStorage.removeItem('fakeUser')
      window.location.href = 'index.html'
    }
  </script>

</body>
</html>
